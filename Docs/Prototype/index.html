<title>Bazaar Blot — Салон у камина</title>

<style>
/* Layout: one landscape stage (scene art 2000×923) with a thin bar above; HUD sits on the stage in scene coordinates. Deliberately single dark "salon" look. */
:root{
  color-scheme: dark;
  --bg:#120b08;
  --panel:rgba(22,13,9,.82);
  --line:rgba(217,164,65,.35);
  --gold:#d9a441;
  --gold-soft:#f1d49a;
  --fg:#f4e9d8;
  --muted:#b9a58a;
  --them:#7cc0b1;
  --paper:#f6eedd;
  --ink:#2a1a10;
  --display:"Marcellus SC","Marcellus",Georgia,serif;
  --serif:"Marcellus",Georgia,serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
.btn{font:600 12px var(--ui);letter-spacing:.04em;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold-soft)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(217,164,65,.16);border-color:var(--gold)}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:16px;background:radial-gradient(ellipse at 50% 40%, #2a1a12, var(--bg) 70%)}
/* iPhone in landscape: the screen is 19.5:9, the same shape as the 2000×923 scene */
.phone{--pw:min(100vw - 32px, calc((100dvh - 40px) * 2.105));position:relative;width:var(--pw);padding:calc(var(--pw) * .0125);border-radius:calc(var(--pw) * .062);background:linear-gradient(145deg,#3b3a3f,#141416 45%,#2b2a2e);box-shadow:0 0 0 calc(var(--pw) * .0016) #6c6a70, inset 0 0 0 calc(var(--pw) * .0035) #050505, 0 30px 80px rgba(0,0,0,.7)}
.phone .key{position:absolute;background:#2c2b30;border-radius:2px}
.phone .k1{top:-3px;left:16%;width:5%;height:4px}
.phone .k2{top:-3px;left:23%;width:7%;height:4px}
.phone .k3{top:-3px;left:31.5%;width:7%;height:4px}
.phone .k4{bottom:-3px;left:24%;width:11%;height:4px}
.island{position:absolute;left:1.4%;top:50%;transform:translateY(-50%);width:2.6%;height:27%;background:#000;border-radius:999px;pointer-events:none;z-index:5}
.homebar{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);width:28%;height:.9%;min-height:3px;background:rgba(255,255,255,.75);border-radius:999px;pointer-events:none;z-index:5}
.topbar{position:absolute;left:calc(4% + var(--m));right:15%;top:var(--m);display:flex;align-items:center;gap:1em;pointer-events:none}
.topbar .ctrls{display:flex;gap:.4em;pointer-events:auto}
.phase{font-family:var(--serif);font-size:1.05em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:2em;padding:.3em 1em;white-space:nowrap}
.phase b{color:var(--gold);font-weight:400}
.stage{--m:calc(var(--u,12px) * 2.2);position:relative;width:100%;aspect-ratio:2000/923;border-radius:calc(var(--pw) * .05);overflow:hidden;background:#000;font-size:var(--u,12px)}
.stage .btn{font-size:.78em;padding:.4em .9em;background:var(--panel);backdrop-filter:blur(4px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.plate{position:absolute;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .4s, transform .5s cubic-bezier(.2,1.6,.4,1);display:flex;align-items:center;gap:.6em;background:var(--panel);border:1px solid var(--line);border-radius:3em;padding:.35em 1.1em .35em .35em;white-space:nowrap;backdrop-filter:blur(4px)}
.plate.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.plate.at-bottom{top:auto!important;bottom:var(--m);transform:translate(-50%,0) scale(.9)}
.plate.at-bottom.on{transform:translate(-50%,0) scale(1)}
.plate .av{width:3.2em;height:3.2em;border-radius:50%;border:2px solid var(--gold);background:#2a1a10 center/cover;flex:none}
.plate.them .av{border-color:var(--them)}
.plate .nm{font-family:var(--serif);font-size:1.15em;line-height:1.1}
.plate .st{font-size:.8em;color:var(--muted);display:flex;align-items:center;gap:.4em;font-variant-numeric:tabular-nums}
.plate .dot{width:.55em;height:.55em;border-radius:50%;background:var(--muted)}
.plate.connecting .dot{background:var(--gold);animation:pulse 1s infinite}
.plate.seated .dot{background:#6fcf7a}
.plate .deal{display:none;font:700 .7em var(--ui);letter-spacing:.08em;color:var(--ink);background:var(--gold);border-radius:1em;padding:.15em .6em;margin-left:.3em}
.plate.dealer .deal{display:inline-block;animation:pop .5s}
@keyframes pulse{50%{opacity:.25}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.bubble{position:absolute;transform:translate(-50%,-100%) scale(.6);transform-origin:50% 100%;opacity:0;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.15em;padding:.55em .95em;border-radius:1em;white-space:nowrap;box-shadow:0 .4em 1.2em rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-.45em;width:.9em;height:.9em;background:var(--paper);transform:translateX(-50%) rotate(45deg)}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bubble.left{transform:translate(-100%,-50%) scale(.6);transform-origin:100% 50%}
.bubble.left.on{transform:translate(-100%,-50%) scale(1)}
.bubble.left::after{left:auto;right:-.45em;bottom:auto;top:50%;transform:translateY(-50%) rotate(45deg)}
.score{position:absolute;right:var(--m);top:var(--m);display:flex;gap:1em;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:.5em 1em;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s}
.score.on{opacity:1}
.score .t{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.score .t span{font-size:.75em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.score .t b{font-family:var(--ui);font-weight:700;font-size:1.5em;color:var(--gold-soft)}
.score .t.them b{color:var(--them)}
.score i{font-style:normal;color:var(--muted)}
.next{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .5s, transform .5s;background:var(--panel);border:1px solid var(--line);border-radius:1em;padding:1em 1.6em;text-align:center;pointer-events:none}
.next.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.next h3{margin:0 0 .2em;font:400 1.6em var(--display);color:var(--gold-soft);letter-spacing:.05em}
.next p{margin:0 0 .8em;color:var(--muted);font-size:.95em}
.next .btn{font-size:.9em}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;background:radial-gradient(ellipse at center, rgba(18,11,8,.55), rgba(10,6,4,.92));transition:opacity .6s;text-align:center;padding-inline:16px}
.intro.off{opacity:0;pointer-events:none}
.intro h1{margin:0;font:400 4.2em var(--display);letter-spacing:.08em;color:var(--gold-soft);text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:1.2em}
.open{font:700 1.15em var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:linear-gradient(#f1d49a,#c98f2e);border:0;border-radius:3em;padding:.9em 2.4em;cursor:pointer;margin-top:.6em;box-shadow:0 .5em 1.6em rgba(217,164,65,.35)}
.open:hover{filter:brightness(1.08)}
.open:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.rotate{display:none;text-align:center;color:var(--muted);font-size:13px;padding-inline:16px;padding-block:0 12px}
@media (orientation:portrait) and (max-width:700px){.rotate{display:block}}
</style>

<div class="wrap">
  <div class="phone" aria-label="iPhone, горизонтально">
  <span class="key k1"></span><span class="key k2"></span><span class="key k3"></span><span class="key k4"></span>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud">
      <div class="topbar">
        <div class="ctrls">
          <button class="btn" id="spd" type="button">1×</button>
          <button class="btn" id="snd" type="button" aria-pressed="true">Звук</button>
          <button class="btn" id="again" type="button">Заново</button>
        </div>
        <div class="phase" id="phase" aria-live="polite">Стол закрыт</div>
      </div>
      <div class="score" id="score">
        <div class="t"><span>Мы</span><b>0</b></div><i>:</i>

      <div class="next" id="next">

      </div>

    <div class="intro" id="intro">
      <h1>Bazaar Blot</h1>
      <p>Салон у камина · 4 игрока · 2 на 2</p>
      <button class="open" id="open" type="button">Открыть стол</button>
    </div>
    <div class="island"></div>
    <div class="homebar"></div>
  </div>
  </div>
</div>
<div class="rotate">Поверните телефон горизонтально, чтобы увидеть стол крупнее.</div>

<script>
const W = 2000, H = 923;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), hud = document.getElementById('hud');
const phaseEl = document.getElementById('phase');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Seats (scene coordinates of the 2000×923 art) ----------
// Teams: bottom + top vs left + right. Dealer: top. Deal goes counter-clockwise from the dealer.
// parts: body pieces cut from the art that move on their own (rect + pivot).
const SEATS = {
  bottom: { name: 'Вы', avatar: 'av_knight.webp', rating: 1840, team: 'us', crop: [770, 725, 460, 198], pivot: [1000, 923], face: [1000, 860, 70],
            pile: [1000, 668], pileRot: 0, plate: [1480, 884], bubble: [1000, 752], say: 'Рыцарь к вашим услугам', greet: 'bow',
            parts: { helm: { r: [925, 790, 150, 133], p: [1000, 905] }, hands: { r: [930, 735, 140, 62], p: [1000, 790] } },
            acts: ['lookAround', 'drum', 'stretch'],
            video: { src: ['knight.webm', 'knight.mp4'], rect: [680, 563, 640, 360] } },
  left:   { name: 'Лаура', avatar: 'av_laura.webp', rating: 1975, team: 'them', crop: [130, 355, 380, 360], pivot: [330, 640], face: [300, 445, 66],
            pile: [592, 525], pileRot: Math.PI / 2, plate: [300, 772], bubble: [330, 352], say: 'Добрый вечер, господа', lines: ['Мне сегодня везёт.', 'Дон, вы опять блефуете?', 'Не спешите, ковбой.'], greet: 'lean',
            parts: { head: { r: [200, 362, 195, 165], p: [355, 525] }, hands: { r: [410, 488, 80, 100], p: [400, 540] } },
            acts: ['tilt', 'tap', 'glance'],
            video: { src: ['laura.webm', 'laura.mp4'], rect: [0, 345, 676, 380] } },
  top:    { name: 'Дон Марко', avatar: 'av_marco.webp', rating: 2310, team: 'us', crop: [790, 15, 410, 290], pivot: [995, 300], face: [965, 100, 56],
            pile: [1000, 383], pileRot: Math.PI, plate: [1335, 150], bubble: [835, 128], bubbleSide: 'left', say: 'Добро пожаловать за мой стол', lines: ['Ставки сделаны, господа.', 'Не торопитесь. Ночь длинная.', 'Карты не лгут. Люди — да.'], greet: 'nod',
            parts: { head: { r: [935, 8, 130, 155], p: [995, 165] }, cigar: { r: [875, 120, 125, 100], p: [890, 215] }, claw: { r: [980, 250, 100, 58], p: [1030, 300] } },
            acts: ['puff', 'puff', 'claw'],
            // AI video loop of this seat (Higgsfield, 16:9). Used instead of the cut-out when the file loads.
            video: { src: ['marco.webm', 'marco.mp4'], rect: [675, 0, 640, 360] } },
  right:  { name: 'Билли Ривз', avatar: 'av_billy.webp', rating: 1690, team: 'them', crop: [1525, 325, 420, 410], pivot: [1720, 650], face: [1790, 452, 85],
            pile: [1408, 525], pileRot: -Math.PI / 2, plate: [1735, 785], bubble: [1730, 318], say: 'Хау! Сдавай, Марко', lines: ['Ну что, сыграем по-крупному?', 'Эта взятка моя, ставлю шляпу.', 'Сдавай быстрее, Марко.'], greet: 'tip',
            parts: { hat: { r: [1690, 335, 205, 160], p: [1795, 445] }, hands: { r: [1540, 520, 100, 105], p: [1600, 600] } },
            acts: ['scratch', 'hat', 'scratch', 'lean'],
            video: { src: ['billy.webm', 'billy.mp4'], rect: [1289, 330, 711, 400] } },
};
// Seat videos: drawn through a soft oval mask so they blend into the empty room.
for (const id in SEATS) {
  const s = SEATS[id];
  if (!s.video) continue;
  const v = document.createElement('video');
  Object.assign(v, { muted: true, loop: false, playsInline: true, preload: 'auto' });
  v.addEventListener('ended', () => { s.moving = false; try { v.currentTime = 0; } catch (e) {} });
  v.src = s.video.src.find(f => v.canPlayType(f.endsWith('.webm') ? 'video/webm; codecs="vp9"' : 'video/mp4')) || s.video.src[1];
  v.addEventListener('canplay', () => { s.vidReady = true; }, { once: true });
  s.vid = v;
  const [, , rw, rh] = s.video.rect, k = 2;
  s.vidCanvas = document.createElement('canvas'); s.vidCanvas.width = rw * k; s.vidCanvas.height = rh * k;
  s.vidMask = new Image(); s.vidMask.src = 'mask_' + s.video.src[0].split('.')[0] + '.png';   // character silhouette, soft edge
}
const JOIN_ORDER = ['bottom', 'left', 'top', 'right'];
const DEAL_ORDER = ['left', 'bottom', 'right', 'top'];   // counter-clockwise, starting to the dealer's right
const PACKETS = [3, 2, 3];
const CIGAR_TIP = [957, 180], MOUTH = [990, 147], CYBER_EYE = [1010, 100];

// ---------- Assets ----------
const img = new Image(); img.src = 'scene.webp';      // characters are cut from this
const room = new Image(); room.src = 'room.webp';     // same room with empty chairs
const atlas = new Image(); atlas.src = 'cards.webp';   // classic standard deck, 7–A, 240×336 cells
let cardBack, cardFaces = {};

function feathered(r, core = .68) {
  const [cx, cy, cw, ch] = r;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  g.drawImage(img, cx, cy, cw, ch, 0, 0, cw, ch);
  g.globalCompositeOperation = 'destination-in';
  g.translate(cw / 2, ch / 2); g.scale(cw / 2, ch / 2);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  gr.addColorStop(0, '#000'); gr.addColorStop(core, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(-1, -1, 2, 2);
  return c;
}
function avatar(seat) {
  const [x, y, r] = seat.face, s = 120;
  const c = document.createElement('canvas'); c.width = c.height = s;
  c.getContext('2d').drawImage(img, x - r, y - r, r * 2, r * 2, 0, 0, s, s);
  try { return c.toDataURL('image/jpeg', .85); } catch (e) { return ''; }
}

// ---------- Cards ----------
const CW = 78, CH = 110, RES = 3, PAD = 10;
const RANKS = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
const SUITS = [{ s: '♠', red: false }, { s: '♥', red: true }, { s: '♣', red: false }, { s: '♦', red: true }];
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function cardCanvas(paint) {
  const c = document.createElement('canvas');
  c.width = (CW + PAD * 2) * RES; c.height = (CH + PAD * 2) * RES;
  const g = c.getContext('2d'); g.scale(RES, RES); g.translate(PAD, PAD);
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
  rr(g, 0, 0, CW, CH, 5); g.fillStyle = '#fdfbf6'; g.fill();
  g.shadowColor = 'transparent';
  g.save(); rr(g, 0, 0, CW, CH, 5); g.clip(); paint(g); g.restore();
  rr(g, 0, 0, CW, CH, 5); g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = .5; g.stroke();
  return c;
}
function makeFace(rank, suit) {
  const col = RANKS.indexOf(rank), row = SUITS.indexOf(suit);
  return cardCanvas(g => g.drawImage(atlas, col * 240 + 1, row * 336 + 1, 238, 334, 0, 0, CW, CH));
}
// Red back in the classic "rider" spirit: white border, fine red filigree field, central medallion.
function makeBack() {
  return cardCanvas(g => {
    const m = 4.5, red = '#b5121f';
    g.fillStyle = red; rr(g, m, m, CW - m * 2, CH - m * 2, 2.5); g.fill();
    g.save(); g.clip();
    g.strokeStyle = 'rgba(255,240,235,.75)'; g.lineWidth = .35;
    for (let y = m + 3; y < CH; y += 6) for (let x = m + 3; x < CW; x += 6) {
      g.beginPath(); g.arc(x, y, 2.1, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + 3, y); g.moveTo(x, y - 3); g.lineTo(x, y + 3); g.stroke();
    }
    g.restore();
    g.strokeStyle = '#fdfbf6'; g.lineWidth = 1; rr(g, m + 2, m + 2, CW - m * 2 - 4, CH - m * 2 - 4, 2); g.stroke();
    g.save(); g.translate(CW / 2, CH / 2);
    g.fillStyle = red; g.beginPath(); g.arc(0, 0, 15, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fdfbf6'; g.lineWidth = 1.1; g.stroke();
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6);
      g.beginPath(); g.ellipse(0, -8, 2.2, 5, 0, 0, Math.PI * 2); g.lineWidth = .5; g.stroke();
    }
    g.beginPath(); g.arc(0, 0, 3, 0, Math.PI * 2); g.fillStyle = '#fdfbf6'; g.fill();
    g.restore();
    for (const [x, y] of [[m + 9, m + 9], [CW - m - 9, m + 9], [m + 9, CH - m - 9], [CW - m - 9, CH - m - 9]]) {
      g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.strokeStyle = '#fdfbf6'; g.lineWidth = .7; g.stroke();
    }
  });
}
class Card {
  constructor(rank, suit) { Object.assign(this, { rank, suit, x: 0, y: 0, rot: 0, sc: .7, flip: 0, alpha: 0, z: 0, lift: 0 }); }
  draw() {
    const im = this.flip > .5 ? cardFaces[this.rank + this.suit.s] : cardBack;
    const sx = Math.abs(Math.cos(this.flip * Math.PI)) || .001;
    ctx.save(); ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.translate(0, -this.lift);
    ctx.scale(this.sc * sx, this.sc);
    ctx.drawImage(im, -(CW / 2 + PAD), -(CH / 2 + PAD), CW + PAD * 2, CH + PAD * 2);
    ctx.restore();
  }
}

// ---------- Tweens ----------
let speed = 1, run = 0;
const tweens = [];
const ease = {
  out: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  lin: p => p,
};
function tween(o, to, dur, opt = {}) {
  return new Promise(res => tweens.push({ o, to, dur: dur * 1000, delay: (opt.delay || 0) * 1000, t: 0, e: opt.ease || ease.out, res, from: null, fn: opt.fn }));
}
const wait = s => tween({}, {}, s);
const anim = (dur, fn) => tween({}, {}, dur, { ease: ease.lin, fn });
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt * speed;
    if (tw.t < tw.delay) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.o[k]; }
    const p = Math.min(1, (tw.t - tw.delay) / (tw.dur || 1)), e = tw.e(p);
    for (const k in tw.to) tw.o[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (tw.fn) tw.fn(p);
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

// ---------- Sound: card flicks, join chime, fireplace (all synthesised) ----------
let ac = null, master = null, soundOn = true, fireOn = false;
function audio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); } catch (e) { return; }
  }
  if (ac.state === 'suspended') ac.resume();
  if (!fireOn) startFire();
}
function noiseBuf(sec, shape) {
  const b = ac.createBuffer(1, Math.max(1, ac.sampleRate * sec | 0), ac.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; d[i] = shape ? shape(w, i / d.length, last) : w; last = d[i]; }
  return b;
}
function flick(vol = .22) {
  if (!ac) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(.07, (w, k) => w * Math.pow(1 - k, 3));

// ---------- Choreography ----------
const bell = p => Math.sin(Math.PI * p);

    const c = s.parts.cigar; c.dx = 9 * ease.inOut(up); c.dy = -7 * ease.inOut(up); c.rot = .05 * ease.inOut(up);

async function join(id, my) {
  const s = SEATS[id];
  plateState(s, 'connecting');
  await wait(.55); if (my !== run) return;
  chime(); plateState(s, 'seated');
  if (s.vid) { try { s.vid.pause(); s.vid.currentTime = 0; } catch (e) {} }
  s.ring = 0; tween(s, { ring: 1 }, .9, { ease: ease.lin });
  tween(s, { light: 1 }, .55);
  sparkle(s.face[0], s.face[1]);
  s.sc = .95; await tween(s, { sc: 1.03 }, .22); if (my !== run) return;
  await tween(s, { sc: 1 }, .18); if (my !== run) return;
  s.bubbleEl.textContent = s.say;
  s.bubbleEl.classList.add('on');
  if (id === 'top') smoke(CIGAR_TIP[0], CIGAR_TIP[1], 8);
  await anim(1.4, p => { if (!s.vidReady) GREET[s.greet](s, p); }); if (my !== run) return;
  resetPose(s); s.idle = true; s.next = clock + 1.5 + Math.random() * 3;
  setTimeout(() => s.bubbleEl.classList.remove('on'), 900 / speed);
}

  const s = SEATS[id], o = (i - 3.5) * 15, horiz = id === 'top' || id === 'bottom';
  return { x: s.pile[0] + (horiz ? o : 0), y: s.pile[1] + (horiz ? 0 : o), rot: s.pileRot + (i - 3.5) * .03 };
}

async function play() {
  const my = ++run;
  tweens.length = 0; resetState();
  const ok = () => my === run;

  setPhase('Подключение к столу…');
  tween(S, { black: 0 }, 1.2);
  await wait(.8); if (!ok()) return;

  let seated = 0;
  for (const id of JOIN_ORDER) {
    setPhase(`Ожидание игроков · <b>${seated}/4</b>`);
    join(id, my);
    await wait(.55); if (!ok()) return;
    seated++; setPhase(`Ожидание игроков · <b>${seated}/4</b>`);
    await wait(1.0); if (!ok()) return;
  }
  await wait(1.4); if (!ok()) return;

  setPhase('Все за столом');
  moves.on = true; moves.next = clock + 4;
  chat.on = true; chat.next = clock + 4 + CHAT_EVERY / 2;
  tween(S, { amb: .14, lamps: 1 }, 1.4);
  document.getElementById('score').classList.add('on');
  await wait(.9); if (!ok()) return;

  const dealer = SEATS.top;
  dealer.plateEl.classList.add('dealer');
  setPhase('Сдаёт <b>Дон Марко</b>');
  for (const su of SUITS) for (const r of RANKS) cards.push(new Card(r, su));
  cards.sort(() => Math.random() - .5);
  cards.forEach((c, i) => Object.assign(c, { x: 1005, y: 290, rot: Math.PI + .2, z: i, alpha: 0, sc: .75 }));
  await Promise.all(cards.map((c, i) => tween(c, { x: 1000, y: 512 - i * .35, rot: Math.PI, alpha: 1, sc: 1 }, .6, { delay: .2, ease: ease.inOut }))); if (!ok()) return;
  flick(.3);

  setPhase('Тасовка');
  for (let rep = 0; rep < 2; rep++) {
    const L = cards.slice(0, 16), R = cards.slice(16);
    await Promise.all(cards.map((c, i) => tween(c, { x: 1000 + (i < 16 ? -62 : 62), rot: Math.PI + (i < 16 ? -.1 : .1) }, .28, { ease: ease.inOut }))); if (!ok()) return;
    const mixed = [];
    for (let i = 0; i < 16; i++) { if (Math.random() < .5) mixed.push(L[i], R[i]); else mixed.push(R[i], L[i]); }
    cards = mixed;
    await Promise.all(cards.map((c, k) => { c.z = k; return tween(c, { x: 1000, y: 512 - k * .35, rot: Math.PI }, .16, { delay: k * .018, fn: p => { if (p === 1 && k % 3 === 0) flick(.12); } }); })); if (!ok()) return;
    await wait(.15); if (!ok()) return;
  }

  const hands = { left: [], bottom: [], right: [], top: [] };
  const deck = cards.slice();
  let zTop = 100;
  for (let pi = 0; pi < PACKETS.length; pi++) {
    setPhase(`Раздача · <b>${PACKETS.join(' · ')}</b> · пачка ${pi + 1}`);
    for (const id of DEAL_ORDER) {
      for (let k = 0; k < PACKETS[pi]; k++) {
        const c = deck.pop(), i = hands[id].length; hands[id].push(c);
        c.z = zTop++;
        const t = pileSlot(id, i);
        flick();
        tween(c, { x: t.x, y: t.y, rot: t.rot }, .34);
        await wait(.075); if (!ok()) return;
      }
      await wait(.12); if (!ok()) return;
    }
    await wait(.25); if (!ok()) return;
  }
  await wait(.4); if (!ok()) return;

  setPhase('Ваши карты');
  const suitOrder = ['♠', '♥', '♣', '♦'];
  const mine = hands.bottom.sort((a, b) => suitOrder.indexOf(a.suit.s) - suitOrder.indexOf(b.suit.s) || RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank));
  const R0 = 1100;
  mine.forEach((c, i) => {
    const a = (i - 3.5) * .058;
    c.z = 300 + i; c.mine = true;
    tween(c, { x: 1000 + Math.sin(a) * R0, y: 850 + R0 * (1 - Math.cos(a)), rot: a, sc: 1.7 }, .5, { delay: i * .04, ease: ease.inOut });
    tween(c, { flip: 1 }, .35, { delay: .45 + i * .06, ease: ease.inOut, fn: p => { if (p === 1) flick(.1); } });
  });
  await wait(1.4); if (!ok()) return;
  setPhase('Раздача завершена');
  document.getElementById('next').classList.add('on');
}

// ---------- Hover on own cards ----------
let hover = null;

  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let hit = null;
  for (const c of [...cards].sort((a, b) => b.z - a.z)) {

    const dx = x - c.x, dy = y - c.y, ca = Math.cos(-c.rot), sa = Math.sin(-c.rot);

    glow(ex, ey, 10 + 18 * top.glow, `rgba(255,${120 + 40 * top.glow},40,${.35 + .55 * top.glow + .08 * Math.sin(clock * 13)})`);
    const h = top.parts.head;
    glow(CYBER_EYE[0] + h.dx, CYBER_EYE[1] + h.dy, 16, `rgba(255,190,60,${(.25 + .2 * Math.sin(clock * 2.3)) * top.light})`);
  }
  ctx.globalCompositeOperation = 'source-over';

  cards.sort((a, b) => a.z - b.z).forEach(c => c.draw());

  if (top.idle && !top.vidReady && clock > nextSmoke) { const c = top.parts.cigar; smoke(CIGAR_TIP[0] + c.dx, CIGAR_TIP[1] + c.dy, 3); nextSmoke = clock + 1.2 + Math.random(); }
  const ds = dt / 1000;
  particles = particles.filter(p => (p.life += ds) < p.max);
  for (const p of particles) {
    if (p.life < 0) continue;
    const k = p.life / p.max;
    if (p.k === 'spark') {
      p.x += p.vx * ds; p.y += p.vy * ds; p.vx *= .96; p.vy *= .96;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,214,130,${1 - k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      p.x += (p.vx + Math.sin(clock * 2 + p.r) * 10) * ds; p.y += p.vy * ds; p.vx *= .99;
      const r = p.r * (1 + k * 4), g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, `rgba(225,220,212,${p.a * (1 - k)})`); g.addColorStop(1, 'rgba(225,220,212,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (moves.on && clock > moves.next) { moveSomeone(); moves.next = clock + MOVE_EVERY; }
  if (chat.on && clock > chat.next) { talk(); chat.next = clock + CHAT_EVERY; }
  if (S.black > 0) { ctx.fillStyle = `rgba(0,0,0,${S.black})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
function glow(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// ---------- Boot ----------
async function boot() {
  await Promise.all([img.decode().catch(() => {}), room.decode().catch(() => {}), atlas.decode().catch(() => {})]);
  for (const id in SEATS) {
    const s = SEATS[id];
    s.sprite = feathered(s.crop);
    for (const k in s.parts) s.parts[k].sprite = feathered(s.parts[k].r, .5);
    const url = s.avatar || avatar(s);
    if (url) s.plateEl.querySelector('.av').style.backgroundImage = `url(${url})`;
  }
  cardBack = makeBack();
  for (const su of SUITS) for (const r of RANKS) cardFaces[r + su.s] = makeFace(r, su);
  resetState();
  S.black = .2;
  requestAnimationFrame(frame);
}
boot();

const intro = document.getElementById('intro');
const start = () => { audio(); intro.classList.add('off'); play(); };
document.getElementById('open').addEventListener('click', start);
document.getElementById('again').addEventListener('click', start);
document.getElementById('again2').addEventListener('click', start);
const speeds = [1, .5, 2];
document.getElementById('spd').addEventListener('click', e => {
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  e.currentTarget.textContent = `${String(speed).replace('.', ',')}×`;
});
document.getElementById('snd').addEventListener('click', e => {
  soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn);
  e.currentTarget.textContent = soundOn ? 'Звук' : 'Без звука';
  if (master) master.gain.value = soundOn ? 1 : 0;
});
</script>
