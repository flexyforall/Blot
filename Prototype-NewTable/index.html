<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Blot Bazar — прототип (новый стол)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>
<div class="stage">
  <div class="device" data-device>
    <div class="device_screen" data-screen>

      <!-- Start: one tap unlocks sound, then the splash plays -->
      <section class="screen screen--start is-active" data-screen-id="start">
        <button class="start" type="button" data-start>
          <img class="start_logo" src="assets/splash/logo.png" alt="Blot Bazar">
          <span class="start_text">Tap to play prototype</span>
        </button>
      </section>

      <!-- Splash: plays once, then hands over to the lobby -->
      <section class="screen screen--splash" data-screen-id="splash">
        <video class="splash_video" data-splash-video playsinline preload="auto">
          <source src="assets/splash/splash_iphone_2556x1180.mp4" type="video/mp4">
          <source src="assets/splash/splash_iphone_2556x1180.webm" type="video/webm">
        </video>
        <button class="splash_skip" data-splash-skip type="button">Skip</button>
      </section>

      <!-- Lobby (Figma: Blot / Lobby, node 1784:85), 852x393 -->
      <section class="screen screen--lobby lobby" data-screen-id="lobby">
        <!-- background, glow and blue colour tint pre-composited (tools: see README) -->
        <img class="lb-bg" src="assets/lobby/figma/bg-composite.webp" alt="">

        <header class="lb-header">
          <div class="lb-profile">
            <img class="lb-avatar" src="assets/lobby/figma/avatar.webp" alt="">
            <div class="lb-profile_info">
              <div class="lb-profile_name">
                <p class="lb-name" data-text="Artexcb">Artexcb</p>
                <img class="lb-rank" src="assets/lobby/figma/rank.webp" alt="">
              </div>
              <div class="lb-progress" aria-label="Уровень: 30%">
                <div class="lb-progress_track"></div>
                <div class="lb-progress_haze"></div>
                <img class="lb-progress_glow lb-progress_glow--wake" src="assets/lobby/figma/glow-wake.svg" alt="">
                <img class="lb-progress_glow lb-progress_glow--envelope" src="assets/lobby/figma/glow-envelope.svg" alt="">
                <img class="lb-progress_glow lb-progress_glow--rim" src="assets/lobby/figma/glow-rim.svg" alt="">
                <div class="lb-progress_head"></div>
                <div class="lb-progress_fill">
                  <div class="lb-progress_base"><img src="assets/lobby/figma/fill.svg" alt=""></div>
                  <div class="lb-progress_taper"><img src="assets/lobby/figma/light-taper.svg" alt=""></div>
                  <div class="lb-progress_filament"><img src="assets/lobby/figma/light-filament.svg" alt=""></div>
                </div>
              </div>
            </div>
          </div>

          <nav class="lb-tabs">
            <button class="lb-pill" type="button">
              <img class="lb-pill_spacer" src="assets/lobby/figma/flag.svg" alt="">
              <span class="lb-pill_bg lb-glass--108"></span>
              <span class="lb-pill_text" data-text="No ads">No ads</span>
              <span class="lb-pill_crown"><img src="assets/lobby/figma/crown.webp" alt=""></span>
            </button>
            <button class="lb-pill" type="button">
              <img class="lb-pill_spacer" src="assets/lobby/figma/flag.svg" alt="">
              <span class="lb-pill_bg lb-glass--78"></span>
              <span class="lb-pill_text" data-text="156">156</span>
              <span class="lb-pill_gem"><span><img src="assets/lobby/figma/gem.webp" alt=""></span></span>
            </button>
            <button class="lb-pill" type="button">
              <img class="lb-pill_spacer" src="assets/lobby/figma/flag.svg" alt="">
              <span class="lb-pill_bg lb-glass--96"></span>
              <span class="lb-pill_text" data-balance data-text="25,000">25,000</span>
              <img class="lb-pill_chip" src="assets/lobby/figma/chip.webp" alt="">
            </button>
          </nav>
        </header>

        <div class="lb-modes">
          <button class="lb-mode lb-mode--training" type="button">
            <img class="lb-mode_tile" src="assets/lobby/figma/card-tile.webp" alt="">
            <img class="lb-mode_art" src="assets/lobby/figma/training.webp" alt="">
            <div class="lb-mode_ellipses"><img src="assets/lobby/figma/ellipses-training.svg" alt=""></div>
            <div class="lb-mode_text">
              <div class="lb-mode_copy">
                <p class="lb-mode_title">Training Game</p>
                <p class="lb-mode_sub">Play with bots to master Blot</p>
              </div>
            </div>
            <span class="lb-mode_dim"></span>
          </button>

          <div class="lb-top">
            <div class="lb-top_plate"></div>
            <div class="lb-top_tile"><img src="assets/lobby/figma/card-tile.webp" alt=""></div>
            <div class="lb-top_art"><img src="assets/lobby/figma/online-art.webp" alt=""></div>
            <img class="lb-top_shade" src="assets/lobby/figma/online-shade.webp" alt="">
            <div class="lb-top_row">
              <div class="lb-top_copy">
                <p class="lb-top_title">Play Online</p>
                <p class="lb-top_sub">Play against random opponents</p>
              </div>
              <button class="lb-play" type="button" data-play>
                <img class="lb-play_effects" src="assets/lobby/figma/play-effects.webp" alt="">
                <span class="lb-play_label">
                  <img class="lb-play_icon" src="assets/lobby/figma/swords.webp" alt="">
                  <span>Play now</span>
                </span>
                <span class="lb-play_inner"></span>
              </button>
            </div>
          </div>

          <button class="lb-mode lb-mode--friends" type="button">
            <img class="lb-mode_tile" src="assets/lobby/figma/card-tile.webp" alt="">
            <img class="lb-mode_art" src="assets/lobby/figma/friends.webp" alt="">
            <div class="lb-mode_ellipses"><img src="assets/lobby/figma/ellipses-friends.svg" alt=""></div>
            <div class="lb-mode_text">
              <div class="lb-mode_copy">
                <p class="lb-mode_title">Play with Friends</p>
                <p class="lb-mode_sub">Battle your friends in Blot now</p>
              </div>
              <div class="lb-mode_line"><img src="assets/lobby/figma/friends-line.svg" alt=""></div>
            </div>
            <span class="lb-mode_dim"></span>
          </button>
        </div>

        <div class="lb-bottom">
          <div class="lb-bottom_group">
            <button class="lb-icon" type="button" aria-label="Друзья">
              <span class="lb-icon_bg"></span><img class="lb-icon_img" src="assets/lobby/figma/users-web.svg" alt="">
            </button>
            <button class="lb-icon" type="button" aria-label="Задания">
              <span class="lb-icon_bg"></span><span class="lb-icon_img lb-icon_img--clipboard"><img src="assets/lobby/figma/clipboard-web.svg" alt=""></span>
            </button>
            <button class="lb-icon" type="button" aria-label="Рейтинг">
              <span class="lb-icon_bg"></span><img class="lb-icon_img" src="assets/lobby/figma/ranking.svg" alt="">
            </button>
            <button class="lb-icon" type="button" aria-label="Турниры">
              <span class="lb-icon_bg"></span><img class="lb-icon_img" src="assets/lobby/figma/sword.svg" alt="">
            </button>
          </div>
          <button class="lb-icon" type="button" aria-label="Настройки" data-settings>
            <span class="lb-icon_bg"></span><img class="lb-icon_img lb-icon_img--gear" src="assets/lobby/figma/gear.svg" alt="">
          </button>
        </div>
      </section>

      <!-- Stage select (Figma: Blot / Play Online - Affordable game, node 1856:1589), 852x393 -->
      <section class="screen screen--play stsel" data-screen-id="play">
        <img class="st-bg" src="assets/play/figma/play-bg.webp" alt="">

        <header class="st-header">
          <button class="st-back" type="button" data-back aria-label="Назад">
            <img src="assets/play/figma/arrow-left.svg" alt="">
          </button>
          <nav class="st-tabs" role="tablist">
            <button class="st-tab is-active" type="button" role="tab" aria-selected="true">Quick Game</button>
            <button class="st-tab" type="button" role="tab" aria-selected="false">Tournaments</button>
            <button class="st-tab" type="button" role="tab" aria-selected="false">Bond</button>
          </nav>
          <div class="st-balance">
            <img class="st-balance_spacer" src="assets/play/figma/flag.svg" alt="">
            <span class="st-balance_bg"></span>
            <span class="st-balance_text" data-balance data-text="25,000">25,000</span>
            <img class="st-balance_chip" src="assets/lobby/figma/chip.webp" alt="">
          </div>
        </header>

        <div class="st-track" data-stages></div>

        <button class="st-play" type="button" data-stage-play aria-label="Играть">
          <span><img src="assets/play/figma/play-button.webp" alt=""></span>
        </button>

        <div class="st-cost">
          <p>This game will cost you</p>
          <span class="st-amount"><img src="assets/lobby/figma/chip.webp" alt=""><b data-stage-cost>20,000</b></span>
        </div>
      </section>

      <!-- Game table: the fireside salon, players take their seats and the cards are dealt. No UI. -->
      <section class="screen screen--table table" data-screen-id="table">
        <canvas class="tb-canvas" aria-label="Игровой стол: игроки садятся, сдаются карты"></canvas>

        <!-- UI (Figma: "Table - In Play", node 1868:456) -->
        <div class="tb-ui">
          <!-- settings (leaves the table in the prototype) and the last trick, top left -->
          <button class="tb-icon tb-icon--gear" type="button" data-table-exit aria-label="Настройки">
            <img src="assets/table/hud/gear.svg" alt="" style="left:-.99px;top:1.01px;width:41.99px;height:41.99px">
          </button>
          <div class="tb-trick" aria-label="Последняя взятка">
            <div class="tb-trick_cards" data-trick-cards hidden></div>
            <div class="tb-trick_empty" data-trick-empty><i></i><i></i><i></i><i></i></div>
          </div>

          <div class="tb-score" aria-label="Счёт">
            <div class="tb-score_cell">
              <p class="tb-score_label">US</p>
              <p class="tb-score_value" data-score="us"><span><b>0</b><small>/301</small></span><span aria-hidden="true"><b>0</b><small>/301</small></span></p>
            </div>
            <span class="tb-score_divider"></span>
            <div class="tb-score_cell">
              <p class="tb-score_label">THEM</p>
              <p class="tb-score_value" data-score="them"><span><b>0</b><small>/301</small></span><span aria-hidden="true"><b>0</b><small>/301</small></span></p>
            </div>
          </div>

          <!-- nameplates (the characters are drawn on the canvas); the lit one with the timer is whose turn it is -->
          <div class="tb-plate tb-plate--left" data-plate="left"><span data-text="Georgi2001">Georgi2001</span><i class="tb-plate_timer"></i></div>
          <div class="tb-plate tb-plate--top" data-plate="top"><span data-text="Vazgen1972">Vazgen1972</span><i class="tb-plate_timer"></i></div>
          <div class="tb-plate tb-plate--right" data-plate="right"><span data-text="GarikAv">GarikAv</span><i class="tb-plate_timer"></i></div>
          <div class="tb-plate tb-plate--bottom" data-plate="bottom"><span data-text="Artexcb">Artexcb</span><i class="tb-plate_timer"></i></div>

          <!-- each player's bid next to them; after the bidding only the contract stays -->
          <div class="tb-chip tb-chip--left" data-chip="left" hidden></div>
          <div class="tb-chip tb-chip--top" data-chip="top" hidden></div>
          <div class="tb-chip tb-chip--right" data-chip="right" hidden></div>
          <div class="tb-chip tb-chip--bottom" data-chip="bottom" hidden></div>

          <!-- your bid: the app's modal style (Figma 1821:5120), low enough to fit above your hand and
               centred: value and Kaput | Pass and Contra / Sur (8px apart in each pair), then the trump tiles -->
          <div class="tb-panel tb-bid" data-bid hidden>
            <div class="tb-bid_row">
              <div class="tb-bid_pair">
                <div class="tb-step">
                  <button class="tb-step_btn" type="button" data-bid-minus aria-label="Less">−</button>
                  <span class="tb-step_value" data-bid-value>8</span>
                  <button class="tb-step_btn" type="button" data-bid-plus aria-label="More">+</button>
                </div>
                <button class="tb-key tb-key--toggle" type="button" data-bid-kaput aria-pressed="false">Kaput</button>
              </div>
              <div class="tb-bid_pair">
                <button class="tb-key" type="button" data-bid-pass>Pass</button>
                <button class="tb-key tb-key--red" type="button" data-bid-contra hidden>Contra</button>
                <button class="tb-key tb-key--red" type="button" data-bid-sur hidden>Sur</button>
              </div>
            </div>
            <div class="tb-bid_suits">
              <button class="tb-tile" type="button" data-bid-suit="C" aria-label="Clubs"><i data-s="C"></i><span data-bid-label>8</span></button>
              <button class="tb-tile" type="button" data-bid-suit="D" aria-label="Diamonds"><i data-s="D"></i><span data-bid-label>8</span></button>
              <button class="tb-tile" type="button" data-bid-suit="H" aria-label="Hearts"><i data-s="H"></i><span data-bid-label>8</span></button>
              <button class="tb-tile" type="button" data-bid-suit="S" aria-label="Spades"><i data-s="S"></i><span data-bid-label>8</span></button>
              <button class="tb-tile" type="button" data-bid-suit="NT" aria-label="No trump"><i data-s="NT">NT</i><span data-bid-label>8</span></button>
            </div>
          </div>

          <!-- end of a round / of the game -->
          <div class="tb-panel tb-result" data-result hidden>
            <div data-result-body></div>
            <button class="tb-key tb-key--primary tb-result_next" type="button" data-result-next>Next round</button>
          </div>

          <!-- bottom bar: chat, reactions | info -->
          <div class="tb-bottom">
            <button class="tb-icon" type="button" data-social="chat" aria-label="Чат" aria-expanded="false">
              <img src="assets/table/hud/chat.svg" alt="" style="left:-.94px;top:1.07px;width:41.88px;height:41.87px">
            </button>
            <button class="tb-icon" type="button" data-social="react" aria-label="Реакции" aria-expanded="false">
              <img src="assets/table/hud/thumbs.svg" alt="" style="left:-1.63px;top:.38px;width:43.25px;height:41.19px">
            </button>
            <button class="tb-icon tb-icon--info" type="button" data-table-info aria-label="Информация">
              <img src="assets/table/hud/info.svg" alt="" style="left:-.94px;top:1.06px;width:41.88px;height:41.88px">
            </button>
            <div class="tb-pop tb-pop--chat" data-pop="chat" hidden>
              <button type="button">Good luck!</button>
              <button type="button">Nice move!</button>
              <button type="button">Hurry up!</button>
              <button type="button">Well played</button>
            </div>
            <div class="tb-pop tb-pop--react" data-pop="react" hidden>
              <button type="button">😂</button><button type="button">😎</button><button type="button">😡</button><button type="button">👍</button><button type="button">🔥</button>
            </div>
          </div>
        </div>
        <div class="tb-say" data-say aria-live="polite"></div>
      </section>

    </div>
    <div class="device_island" aria-hidden="true"></div>
  </div>
  <button class="sound-toggle" type="button" data-sound-toggle>
    <svg class="sound-toggle_on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <svg class="sound-toggle_off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</div>
<script src="js/app.js"></script>
<script src="js/sounds.js"></script>
<script src="js/stage.js"></script>
<script src="js/blot-rules.js"></script>
<script src="js/table.js"></script>
<script src="js/game.js"></script>
</body>
</html>
